<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astheral</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#101525;color:#e9eafa}body{max-width:760px;margin:4rem auto;padding:0 1rem}h1{font-size:2.8rem;margin-bottom:.4rem}p{line-height:1.6;color:#b5bedb}article{white-space:pre-wrap;line-height:1.6;padding:1rem 1.2rem;background:#1c2540;border-radius:12px;margin:1rem 0}article[data-role=user]{background:#30325d}form{display:flex;gap:.7rem;margin-top:2rem}input,button{font:inherit;border:1px solid #525d84;border-radius:10px;padding:1rem}input{flex:1;min-width:0;background:#171f35;color:inherit}button{background:#c8bdff;color:#17142c;cursor:pointer}button:disabled{opacity:.5}#status{font-size:.85rem}
</style>
<h1>Astheral</h1><p>A friendly AI assistant, trained from scratch.</p>
<p id="status">Loading checkpoint information…</p><main id="conversation" aria-live="polite"></main>
<form><input aria-label="Message" placeholder="Say hello to Astheral" required maxlength="8000"><button>Send</button></form>
<script>
const messages=[], form=document.querySelector('form'), input=document.querySelector('input'), button=document.querySelector('button');
function add(role,text){const node=document.createElement('article');node.dataset.role=role;node.textContent=(role==='user'?'You':'Astheral')+'\n'+text;document.querySelector('main').append(node);node.scrollIntoView({behavior:'smooth'});}
fetch('/health').then(r=>r.json()).then(h=>{document.querySelector('#status').textContent=`${h.parameters.toLocaleString()} parameters · checkpoint step ${h.checkpoint_step.toLocaleString()}. Experimental checkpoint: responses may be incoherent during early training.`;}).catch(()=>{document.querySelector('#status').textContent='Could not read model status.';});
form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;messages.push({role:'user',content:text});add('user',text);input.value='';button.disabled=true;try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,max_tokens:64})});const data=await r.json();if(!r.ok)throw Error(data.error);messages.push({role:'assistant',content:data.response});add('assistant',data.response);}catch(error){messages.pop();add('assistant','Generation failed: '+error.message);}finally{button.disabled=false;input.focus();}});
</script>
</html>
